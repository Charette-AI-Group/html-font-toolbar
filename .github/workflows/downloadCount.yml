name: Download count

# Keeps stats/downloads.json in step with Obsidian's published statistics, so
# the catalog at charette-ai-group.github.io/web can show this plugin's total
# without pulling their 2 MB file on every visit.
#
# This used to read the plugin's community directory page, which was fresher
# at the time. It is not a safe source: it froze for weeks at a stale value
# while reporting success, then began rounding to "1k" once the count passed a
# thousand. See scripts/updateDownloadCount.js.

on:
  schedule:
    - cron: "20 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: downloadCount
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Throws rather than writing a number it cannot verify, so a bad read
      # fails this run instead of publishing nonsense.
      - name: Read the published count
        run: node scripts/updateDownloadCount.js

      - name: Commit it when it changed
        run: |
          if [ -z "$(git status --porcelain -- stats/downloads.json)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/downloads.json
          git commit -m "Update download count"
          # A push can fail for reasons that have nothing to do with this
          # workflow: GitHub's own git servers occasionally reject one with an
          # internal error ("fatal error in commit_refs" on 2026-11-10, while
          # the sister plugin's identical run succeeded three minutes later),
          # and someone may push to main while this runs. Either way, catch up
          # with main and try again before giving up.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Push attempt $attempt failed; retrying."
              sleep $((attempt * 10))
              git pull --rebase
            fi
          done
          echo "Push still failing after 3 attempts."
          exit 1
